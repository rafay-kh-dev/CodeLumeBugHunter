@if (open()) {
  <div class="modal show" (click)="closed.emit()">
    <div class="palette" (click)="$event.stopPropagation()" (keydown)="onKey($event)">
      <div class="p-search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#8A9AB0"
          stroke-width="1.6"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg>
        <input
          #paletteInput
          [value]="query()"
          (input)="query.set($any($event.target).value); selected.set(0)"
          placeholder="Type a command or search..."
        />
        <span class="kbd">Esc</span>
      </div>
      <div id="paletteItems">
        @for (it of filtered(); track it.title; let i = $index) {
          <div
            class="p-item"
            [class.on]="i === selected()"
            (click)="run(it.act)"
            (mouseenter)="selected.set(i)"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#4285F4"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m18 16 4-4-4-4" />
              <path d="m6 8-4 4 4 4" />
              <path d="m14.5 4-5 16" />
            </svg>
            <div>
              <b>{{ it.title }}</b>
              <p>{{ it.desc }}</p>
            </div>
            <span class="kbd">{{ it.key }}</span>
          </div>
        }
        @if (filtered().length === 0) {
          <div class="p-item" style="cursor: default">
            <div>
              <b>No results</b>
              <p>Try another command</p>
            </div>
          </div>
        }
      </div>
      <div class="p-footer">
        <span><b>↑↓</b> Navigate</span><span><b>Enter</b> Select</span><span><b>Esc</b> Close</span>
      </div>
    </div>
  </div>
}
