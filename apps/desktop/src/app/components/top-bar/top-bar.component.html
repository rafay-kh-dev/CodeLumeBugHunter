<div class="top">
  <div>
    <h1>Dashboard</h1>
    <p>Welcome back, here is what is happening today.</p>
  </div>
  <div class="top-actions">
    <div class="search" (click)="openPalette()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8A9AB0"
        stroke-width="1.6"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4.3-4.3" /></svg
      ><input placeholder="Search issues, files... (Ctrl K)" readonly /><span class="kbd"
        >Ctrl K</span
      >
    </div>
    <div class="icon-btn" (click)="toggleNotif($event)">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8A9AB0"
        stroke-width="1.6"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg
      ><span class="dot-notif"></span>
    </div>
    <div class="icon-btn" (click)="go('settings')">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#8A9AB0"
        stroke-width="1.6"
      >
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
        />
      </svg>
    </div>
  </div>
</div>
<div class="notif" *ngIf="showNotif">
  <div class="n-head"><b>Notifications</b><span>Mark all read</span></div>
  <div class="n-item">
    <b>Scan complete</b>
    <p>CodeLume — 12 issues found</p>
  </div>
  <div class="n-item">
    <b>3 high issues need attention</b>
    <p>server.js : 84 — hardcoded token</p>
  </div>
</div>
<div class="modal" *ngIf="showPalette" (click)="closePalette()">
  <div class="palette" (click)="$event.stopPropagation()">
    <div class="p-search">
      <input placeholder="Type a command or search..." autofocus /><span class="kbd">Ctrl K</span>
    </div>
    <div class="p-item" (click)="go('scanner')">
      <b>Scan Current Project</b><span class="kbd">Enter</span>
    </div>
    <div class="p-item" (click)="go('issues')"><b>View Issues</b><span class="kbd">I</span></div>
    <div class="p-item" (click)="go('reports')">
      <b>Export Report as Markdown</b><span class="kbd">E</span>
    </div>
  </div>
</div>
